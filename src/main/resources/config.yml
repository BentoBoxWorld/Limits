# Game Modes covered by limits
gamemodes:
- AcidIsland
- BSkyBlock
- CaveBlock
- AOneBlock

# Ignore this island's center block. For most worlds, this is bedrock, but for AOneBlock it is
# the magic block, so ignoring it from limits makes sense.
ignore-center-block: true

# Permissions
# Island owners can be given permissions that override all general settings.
#
# Two formats are supported:
#   1. <gamemode>.island.limit.<KEY>.<NUMBER>           — applied to every environment.
#      e.g.  bskyblock.island.limit.hopper.20
#   2. <gamemode>.island.limit.<env>.<KEY>.<NUMBER>     — applied to one environment only.
#      e.g.  bskyblock.island.limit.nether.hopper.5
#      <env> is one of: overworld, nether, end
#
# Permissions activate when the island owner logs in.
#
# Cooldown for player recount command in seconds
cooldown: 120

# Reconcile an island's stored entity counts with a background recount when its owner logs in.
# Fixes counts that drift away from reality (e.g. mobs born without a tracked spawn event such
# as sniffer eggs, or increments lost in a crash before the batched save).
#
# Off by default. A recount loads every chunk of the island's protection area in the overworld,
# nether and end (where the game mode has nether/end islands), so it costs disk IO and chunk
# loading in proportion to the square of the protection range: 64 chunks per world at the
# default range of 50, but 2,601 at range 400. Islands are recounted one at a time in the
# background and only the entity counts are rewritten; block counts are left untouched.
#
# The recount only sees entities in chunks that are still loaded when it finishes, so it is
# accurate when the owner is on the island and the island fits within view distance. Counts are
# replaced, not merged: a recount that sees fewer entities than the event tracking counted
# lowers the count.
recount-on-join: false
# Minimum seconds between automatic recounts of the same island (shared with the periodic sweep).
recount-on-join-cooldown: 300

# Periodically sweep online islands to reconcile their entity counts, even while owners stay
# logged in. Off by default; same cost and caveats as recount-on-join.
recount-periodic: false
# Seconds between periodic sweep cycles.
recount-periodic-interval: 300
# Islands to reconcile per sweep cycle. Keep small on high-population servers.
recount-periodic-batch: 2

# Islands whose protection area covers more than this many chunks per world are never recounted
# automatically; a warning is logged once per island. 1000 chunks is a protection range of about
# 240. Manual recounts via the recount and calc commands are not affected.
recount-max-chunks: 1000

# Log limits on join (to console). Off by default - enable only for debugging as it
# can be noisy in console logs for servers with many permission-based limits.
log-limits-on-join: false

# Use async checks for snowmen and iron golums. Set to false if you see problems.
async-golums: true

# Show players a message when they hit a limit. Set to false to enforce limits
# silently - placements and spawns are still blocked, but no message is sent.
show-limit-messages: true

# Apply limit permissions from team members as well as the island owner.
# When enabled, a team member's <gamemode>.island.limit.* permissions are merged into
# the island's limits when the member logs in (the highest value wins). The owner's
# login still recalculates the limits from scratch and then merges in the permissions
# of any online team members.
# Limits only recalculate on login, so removing a member (or revoking their permission)
# takes effect the next time the owner logs in.
# Coop and trusted players are not team members and their permissions never apply.
apply-member-limit-perms: false

# General block limiting
# Use this section to limit how many blocks can be added to an island.
# 0 means the item will be blocked from placement completely.
# These limits apply independently in every environment (overworld, nether, end).
# A HOPPER limit of 10 means the player can place up to 10 hoppers in each of overworld,
# nether, and end — 30 hoppers total across the island.
# Use blocklimits-nether / blocklimits-end below to override per environment.
# The following general terms can be used: STAIRS, DOORS, SIGNS, LOGS, SNOW, LEAVES,
# SHULKER_BOXES, BANNERS, RAILS, ICE, BUTTONS, CANDLE_CAKES, CAMPFIRES, SLABS, STONE_BRICKS
# ItemsAdder / Oraxen custom blocks can be limited too (when the plugin is installed):
# use the ItemsAdder namespaced id, or an Oraxen id prefixed with "oraxen:", as the key.
# Quote keys containing a colon. Custom blocks are tracked from their place/break
# events; a recount preserves their stored counts rather than rescanning them.
#  "iafestivities:christmas/christmas_tree/green_orb": 5
#  "oraxen:caveblock": 10
blocklimits:
  HOPPER: 10

# Count stackable plants (SUGAR_CANE, BAMBOO, KELP) as a single plant no matter how
# tall they grow. When false (default), every segment of the plant counts toward the
# limit (for KELP, the KELP_PLANT stalk segments count as KELP).
# Run a recount (/<gamemode> limits recount) after changing this so stored counts
# match the new counting rule.
stacked-plants-count-as-one: false

# Override block limits in the nether for this game mode.
# Uncomment and add entries to set nether-only limits.
#blocklimits-nether:
#  HOPPER: 5

# Override block limits in the end for this game mode.
#blocklimits-end:
#  HOPPER: 5

# Block Groups
# Same idea as entity groups below: one shared limit across a set of block materials.
# The counts of every member are summed and checked against the group limit, so players
# cannot dodge a limit by converting between related blocks (e.g. grass -> dirt) or
# splitting across variants (e.g. pistons and sticky pistons).
# Individual blocklimits still apply on top if both are set.
# Run a recount (/<gamemode> limits recount) after adding a group so existing blocks
# are counted.
#blockgrouplimits:
#  Pistons:
#    icon: PISTON
#    limit: 10
#    materials:
#    - PISTON
#    - STICKY_PISTON
#  Soil:
#    icon: GRASS_BLOCK
#    limit: 200
#    materials:
#    - GRASS_BLOCK
#    - DIRT
#    - DIRT_PATH
#    - FARMLAND
# Override a block group's limit per environment. The group must already be defined
# in blockgrouplimits; only the numeric limit can be overridden.
#blockgrouplimits-nether:
#  Pistons: 5
#blockgrouplimits-end:
#  Pistons: 5

# This section is for world-named limits and overrides any environment-default limit
# above for that specific world. Specify each world you want to limit individually
# (including nether and end worlds). If these worlds are not covered by the game modes
# above, nothing will happen.
worlds:
  AcidIsland_world:
    HOPPER: 11

# Default entity limits within a player's island space (protected area and to island limit).
# Limits apply independently per environment, the same way blocklimits do.
# Affects all types of creature spawning. Also includes entities like MINECARTS.
# Note: Only the first 49 limited blocks and entities are shown in the limits GUI.
entitylimits:
  ENDERMAN: 5
  CHICKEN: 10

# Override entity limits in the nether.
#entitylimits-nether:
#  PIGLIN: 20
#  HOGLIN: 5

# Override entity limits in the end.
#entitylimits-end:
#  ENDERMAN: 50

# Entity Groups
# Name the group anything you like
# Select an icon, which is a Bukkit Material
# Select the limit for the total group
# List the entities in the group using Bukkit EntityTypes
# Group limits apply independently per environment.
entitygrouplimits:
